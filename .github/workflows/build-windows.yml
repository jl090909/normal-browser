name: Build Windows
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: cd apps/desktop && npm install
      - run: cd apps/desktop && npx electron-builder --win
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.5.0
          name: Normal Browser v0.5.0
          files: |
            apps/desktop/dist_electron/*.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
